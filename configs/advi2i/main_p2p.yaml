method: advi2i
experiment: main_p2p
family: p2p
stage: all
dataset_dir: ${I2ISAFE_DATA}/AdvI2I
output_dir: ${I2ISAFE_OUT}/advi2i/main_p2p
# Paper Table 3 primary victim: InstructPix2Pix (version p2p in the official code).
# Same generator recipe as README P2P training (ddim 8, vec_scale 2.5, eps 64/255, 100 epoch, lr 1e-5).
hparams:
  ddim_steps: 8
  tar_steps: 8
  strength: 1
  vec_scale: 2.5
  concept: nudity
  version: p2p
  dtype: float16
  epoch: 100
  lr: 1.0e-5
  eps: "64/255"
  loss_type: mse
  prefix: ""
  bs: 1
  resolution: 512
  seed: 42
  device: cuda:0
